# Potential Field Planner Parameters
potential_field_planner:
  ros__parameters:
    ka: 1.5
    kr: 0.3
    k_angular: 0.4
    rho_0: 0.5
    goal_tolerance: 0.25
    smoothing_factor: 0.3
    max_linear_speed: 0.2
    max_angular_speed: 0.25
    scan_subsample: 3
    use_omnidirectional: true

# A* Planner Parameters
astar_planner:
  ros__parameters:
    inflation_radius: 3
    rdp_epsilon: 0.3
    max_waypoint_spacing: 1.5
    use_eight_connected: true

# Planner Coordinator Parameters
planner_coordinator:
  ros__parameters:
    stuck_timeout: 15.0
    waypoint_reached_tolerance: 0.3

# Particle Filter (MCL) Parameters
particle_filter:
  ros__parameters:
    num_particles: 500
    num_beams: 60
    max_laser_range: 15.0
    sigma_hit: 0.2
    alpha1: 0.1
    alpha2: 0.05
    alpha3: 0.1
    alpha4: 0.05
    resample_threshold: 0.5
    random_particle_ratio: 0.05
    update_min_distance: 0.1
    update_min_angle: 0.1


frontier_explorer:
  ros__parameters:
    min_frontier_size: 5          # min cells to count as a valid frontier cluster
    exploration_rate: 3.0         # seconds between exploration cycles
    distance_weight: 1.0          # closer frontiers preferred
    size_weight: 2.0              # larger frontiers preferred (more info gain)
    goal_reached_tolerance: 0.5   # meters to consider frontier reached
    blacklist_radius: 0.5         # meters — don't revisit nearby failed goals
    max_failed_attempts: 3        # attempts before blacklisting
    min_goal_distance: 0.3        # ignore frontiers closer than this
    navigation_timeout: 30.0      # seconds before giving up on a frontier
