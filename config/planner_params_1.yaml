# ═══════════════════════════════════════════════════════════════
# Potential Field Planner
# ═══════════════════════════════════════════════════════════════
potential_field_planner:
  ros__parameters:
    ka: 1.5
    kr: 0.3
    k_angular: 0.4
    rho_0: 0.3
    goal_tolerance: 0.25
    max_linear_speed: 0.3
    max_angular_speed: 0.5
    scan_subsample: 3
    use_omnidirectional: true
    pub_markers: false

# ═══════════════════════════════════════════════════════════════
# A* Planner
# ═══════════════════════════════════════════════════════════════
astar_planner:
  ros__parameters:
    inflation_radius: 7
    rdp_epsilon: 0.3
    max_waypoint_spacing: 1.5
    use_eight_connected: true

# ═══════════════════════════════════════════════════════════════
# Planner Coordinator
# ═══════════════════════════════════════════════════════════════
planner_coordinator:
  ros__parameters:
    waypoint_reached_tolerance: 0.3
    stuck_timeout: 10.0

# ═══════════════════════════════════════════════════════════════
# Particle Filter (MCL) — tuned for fast convergence
# ═══════════════════════════════════════════════════════════════
particle_filter:
  ros__parameters:
    num_particles: 1500           # more particles = better coverage during init
    num_beams: 60                 # more beams = sharper discrimination between particles
    max_laser_range: 10.0

    # Sensor model — tight sigma kills wrong particles fast
    min_scans: 5
    sigma_hit: 0.15               # tighter than 0.2 — wrong particles die faster
    z_hit: 0.9                    # trust sensor hits strongly
    z_rand: 0.1                   # small uniform component for robustness

    # Motion model noise — LOW so sensor model dominates
    alpha1: 0.01                  # rotation noise from rotation (was 0.1)
    alpha2: 0.03                  # translation noise from translation (was 0.05)
    alpha3: 0.03                  # translation noise from translation (was 0.1)
    alpha4: 0.01                  # rotation noise from rotation (was 0.05)
    
    local_particles: 0.5
    # Resampling — aggressive to kill bad particles
    resample_threshold: 0.6       # resample more often (was 0.5)
    random_particle_ratio: 0.03   # less random noise (was 0.05)

    # Update triggers — more frequent updates
    update_min_distance: 0.03     # update after 3cm movement (was 0.05)
    update_min_angle: 0.03        # update after 0.03 rad rotation (was 0.05)

    # Initialization
    init_spread_radius: 1.0       # 70% of particles within 1m of odom start
    convergence_boost_updates: 30 # first 30 updates use tighter sigma and forced resampling

# ═══════════════════════════════════════════════════════════════
# Frontier Explorer
# ═══════════════════════════════════════════════════════════════
frontier_explorer:
  ros__parameters:
    min_frontier_size: 5
    exploration_rate: 2.0
    distance_weight: 1.0
    size_weight: 2.0
    goal_reached_tolerance: 0.5
    blacklist_radius: 0.5
    max_failed_attempts: 3
